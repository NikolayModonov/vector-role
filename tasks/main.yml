---
- name: Create vector config directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    mode: '0755'

- name: Download Vector
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "/tmp/{{ vector_archive_name }}"

- name: Unpack Vector
  ansible.builtin.unarchive:
    src: "/tmp/{{ vector_archive_name }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true

- name: Create Vector config
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    mode: '0644'

- name: Create systemd unit for Vector
  ansible.builtin.copy:
    dest: /etc/systemd/system/vector.service
    content: |
      [Unit]
      Description=Vector
      After=network.target
      [Service]
      ExecStart={{ vector_install_dir }}/vector-x86_64-unknown-linux-gnu/bin/vector --config {{ vector_config_dir }}/vector.toml
      Restart=always
      [Install]
      WantedBy=multi-user.target

- name: Start Vector
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
    daemon_reload: true